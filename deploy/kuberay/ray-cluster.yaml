apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: fedgraph-gpu
  namespace: default
  labels:
    app.kubernetes.io/name: fedgraph
spec:
  rayVersion: "2.56.0"
  enableInTreeAutoscaling: true
  autoscalerOptions:
    version: v2
    idleTimeoutSeconds: 300
    upscalingMode: Default
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  headGroupSpec:
    serviceType: ClusterIP
    rayStartParams:
      dashboard-host: "0.0.0.0"
      metrics-export-port: "8080"
      num-cpus: "0"
    template:
      metadata:
        labels:
          app.kubernetes.io/name: fedgraph
      spec:
        nodeSelector:
          ray-node-type: head
        securityContext:
          fsGroup: 100
          fsGroupChangePolicy: OnRootMismatch
        containers:
          - name: ray-head
            image: "__FEDGRAPH_IMAGE__"
            imagePullPolicy: IfNotPresent
            env:
              - name: RAY_GRAFANA_HOST
                value: http://prometheus-grafana.prometheus-system.svc:80
              - name: RAY_GRAFANA_IFRAME_HOST
                value: http://127.0.0.1:3000
              - name: RAY_PROMETHEUS_HOST
                value: http://prometheus-kube-prometheus-prometheus.prometheus-system.svc:9090
              - name: RAY_PROMETHEUS_NAME
                value: Prometheus
              - name: RAY_memory_usage_threshold
                value: "0.90"
            ports:
              - name: gcs-server
                containerPort: 6379
              - name: dashboard
                containerPort: 8265
              - name: client
                containerPort: 10001
              - name: serve
                containerPort: 8000
              - name: metrics
                containerPort: 8080
            resources:
              requests:
                cpu: "2"
                memory: 6Gi
              limits:
                cpu: "3"
                memory: 8Gi
            volumeMounts:
              - name: results
                mountPath: /results
              - name: ray-tmp
                mountPath: /tmp/ray
        volumes:
          - name: results
            persistentVolumeClaim:
              claimName: fedgraph-results
          - name: ray-tmp
            emptyDir: {}
  workerGroupSpecs:
    - groupName: gpu-workers
      replicas: 0
      minReplicas: 0
      maxReplicas: 5
      rayStartParams:
        metrics-export-port: "8080"
      template:
        metadata:
          labels:
            app.kubernetes.io/name: fedgraph
        spec:
          nodeSelector:
            ray-node-type: gpu-worker
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
          containers:
            - name: ray-worker
              image: "__FEDGRAPH_IMAGE__"
              imagePullPolicy: IfNotPresent
              env:
                - name: RAY_memory_usage_threshold
                  value: "0.92"
              ports:
                - name: metrics
                  containerPort: 8080
              resources:
                requests:
                  cpu: "3"
                  memory: 12Gi
                  nvidia.com/gpu: "1"
                limits:
                  cpu: "3"
                  memory: 12Gi
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: ray-tmp
                  mountPath: /tmp/ray
          volumes:
            - name: ray-tmp
              emptyDir: {}
